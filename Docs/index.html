<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicknotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>...Capture your Ideas..</p>
    </header>
    <main>
    <form id="note-form">
    <label for="note-title">Note Title</label>
    <br>
    <input
        id="note-title"
        type="text"
        placeholder="Enter the title..."
        maxlength="100"
        required
    >
    <br>

    <label for="body-input">Type Something</label>
    <br>
    <textarea id="body-input"></textarea>
    <br>

    <button type="submit" id="submit-btn">Submit</button>
</form>

<button type="button" id="load-btn">Load Notes</button>

<p id="status" role="status" aria-live="polite"></p>
<ul id="notes-list">Your Notes</ul>
   
    </main>
    <footer>&copy;QuickNotes 2026 .All Rights Reserved</footer>
    
</body>
</html>
