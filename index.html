<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>QuickNotes</h1>
            <p>Capture your ideas.</p>
        </div>
    </header>

    <main class="container">
        <section class="note-editor">
            <h2>Create a note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="note-title">Note title</label>
                    <input
                        type="text"
                        id="note-title"
                        placeholder="Enter your note title"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="body-input">Note content</label>
                    <textarea
                        id="body-input"
                        placeholder="Write your thoughts..."
                        rows="4"
                        required
                    ></textarea>
                </div>

                <button type="submit" id="submit-btn">
                    Add Note
                </button>
            </form>

            <button type="button" id="load-btn" class="secondary-btn">
                Load Notes
            </button>

            <p id="status" role="status" aria-live="polite">
                Ready to capture your ideas.
            </p>
        </section>

        <section class="notes-section">
            <h2>Your Notes</h2>
            <div id="notes-list" class="notes-list">
                <!-- Notes will be displayed here by api.js -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>QuickNotes &copy; 2026. Keep your ideas organized.</p>
    </footer>
</body>
</html>
